<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Análise Iridológica Touch</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 12px; background: #f8fafc; color: #0f172a; user-select: none; -webkit-user-select: none; }
  h2 { margin: 0 0 4px 0; font-size: 20px; color: #0369a1; }
  .sub { font-size: 12px; color: #64748b; margin-bottom: 12px; }
  .box { background: #fff; padding: 12px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 12px; }
  .row { display: flex; gap: 8px; margin-bottom: 8px; }
  input[type="text"] { flex: 1; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; }
  .btn-up { display: block; background: #0284c7; color: #fff; text-align: center; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; }
  input[type="file"] { display: none; }
  .tabs { display: flex; gap: 6px; margin: 10px 0; }
  .btn { flex: 1; padding: 10px 4px; border: 1px solid #cbd5e1; border-radius: 8px; background: #fff; font-weight: 600; font-size: 13px; text-align: center; cursor: pointer; }
  .btn.active { background: #0284c7; color: #fff; border-color: #0284c7; }
  .chk-row { display: flex; justify-content: space-around; font-size: 13px; margin-bottom: 8px; font-weight: 500; }
  .canvas-box { position: relative; width: 100%; max-width: 480px; margin: 0 auto; border-radius: 12px; overflow: hidden; background: #000; touch-action: none; }
  canvas { width: 100%; display: block; touch-action: none; }
  .metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .m-card { background: #f1f5f9; padding: 10px; border-radius: 8px; border-left: 4px solid #0284c7; }
  .m-lbl { font-size: 11px; color: #64748b; font-weight: bold; }
  .m-val { font-size: 18px; font-weight: 800; margin-top: 2px; }
  .diag { grid-column: span 2; background: #e0f2fe; padding: 10px; border-radius: 8px; font-size: 13px; line-height: 1.4; }
  .btn-dl { width: 100%; margin-top: 12px; padding: 12px; background: #16a34a; color: #fff; border: none; border-radius: 8px; font-weight: bold; font-size: 15px; }
</style>
</head>
<body>

<h2>🔬 Estação Iridológica Touch</h2>
<div class="sub">Instantâneo • Use 1 dedo para arrastar e 2 dedos (pinça) para ajustar os anéis</div>

<div class="box">
  <div class="row">
    <input type="text" id="pacNome" placeholder="Nome do Avaliado" value="Lavinia">
    <input type="text" id="pacOlho" placeholder="Olho (OD / OE)" value="OE" style="max-width:80px;">
  </div>
  <div class="row" style="margin-bottom:0;">
    <input type="text" id="pacQueixa" placeholder="Queixa Principal / Observações" value="Depressão">
  </div>
</div>

<label class="btn-up">
  📸 Carregar Foto da Íris (Galeria ou Câmera)
  <input type="file" id="fIn" accept="image/*">
</label>

<div id="appArea" style="display:none;">
  <div class="tabs">
    <div id="bMove" class="btn active" onclick="setM('move')">✥ Mover Tudo</div>
    <div id="bIris" class="btn" onclick="setM('iris')">🟢 Anel Íris</div>
    <div id="bPup" class="btn" onclick="setM('pup')">🟡 Anel Pupila</div>
  </div>

  <div class="chk-row">
    <label><input type="checkbox" id="cJen" checked onchange="render()"> 7 Anéis Jensen</label>
    <label><input type="checkbox" id="cRai" checked onchange="render()"> Raios 30°</label>
    <label><input type="checkbox" id="cZom" onchange="render()"> 🔍 Lupa 2x</label>
  </div>

  <div class="canvas-box">
    <canvas id="cv" width="500" height="500"></canvas>
  </div>

  <div class="box" style="margin-top:10px; padding:8px;">
    <div style="font-size:11px; font-weight:bold; margin-bottom:4px;">Projeção Polar de Daugman (0° a 360°)</div>
    <canvas id="pCv" width="360" height="65" style="height:65px; border-radius:4px;"></canvas>
  </div>

  <div class="metrics">
    <div class="m-card"><div class="m-lbl">PUPILA / ÍRIS</div><div class="m-val" id="vProp">--%</div></div>
    <div class="m-card"><div class="m-lbl">TRAMA (FIBRAS)</div><div class="m-val" id="vTex">--</div></div>
    <div class="diag" id="vDiag">Toque e ajuste os anéis sobre a íris.</div>
  </div>

  <button class="btn-dl" onclick="dlLaudo()">📥 Baixar Relatório Iridológico</button>
</div>

<script>
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const pCv = document.getElementById('pCv'), pCtx = pCv.getContext('2d');
let img = new Image(), loaded = false;
let cx = 250, cy = 250, rP = 55, rI = 170, mode = 'move';
let drag = false, sx = 0, sy = 0, scx = 0, scy = 0, srP = 0, srI = 0, pinch0 = null;
let laudoTxt = "";

function setM(m) {
  mode = m;
  document.getElementById('bMove').className = 'btn' + (m==='move'?' active':'');
  document.getElementById('bIris').className = 'btn' + (m==='iris'?' active':'');
  document.getElementById('bPup').className = 'btn' + (m==='pup'?' active':'');
  render();
}

document.getElementById('fIn').onchange = e => {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = ev => {
    img.onload = () => {
      cx = 250; cy = 250; rP = 55; rI = 170; loaded = true;
      document.getElementById('appArea').style.display = 'block';
      render(); analisar();
    };
    img.src = ev.target.result;
  };
  r.readAsDataURL(f);
};

function pos(t) {
  const b = cv.getBoundingClientRect();
  return { x: (t.clientX - b.left)*(cv.width/b.width), y: (t.clientY - b.top)*(cv.height/b.height) };
}

cv.addEventListener('touchstart', e => {
  e.preventDefault();
  if (e.touches.length === 2) {
    pinch0 = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    srI = rI; srP = rP;
  } else if (e.touches.length === 1) {
    drag = true; const p = pos(e.touches[0]);
    sx = p.x; sy = p.y; scx = cx; scy = cy; srI = rI; srP = rP;
  }
}, {passive:false});

cv.addEventListener('touchmove', e => {
  e.preventDefault();
  const z = document.getElementById('cZom').checked ? 2 : 1;
  if (e.touches.length === 2 && pinch0) {
    const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    const k = d / pinch0;
    if (mode === 'pup') rP = Math.max(10, Math.min(rI - 10, srP * k));
    else rI = Math.max(rP + 15, Math.min(245, srI * k));
    render();
  } else if (e.touches.length === 1 && drag) {
    const p = pos(e.touches[0]);
    const dx = (p.x - sx)/z, dy = (p.y - sy)/z;
    if (mode === 'move') { cx = Math.max(30, Math.min(470, scx + dx)); cy = Math.max(30, Math.min(470, scy + dy)); }
    else if (mode === 'iris') rI = Math.max(rP + 15, Math.min(245, srI + dx * 0.8));
    else if (mode === 'pup') rP = Math.max(10, Math.min(rI - 10, srP + dx * 0.8));
    render();
  }
}, {passive:false});

cv.addEventListener('touchend', () => { drag = false; pinch0 = null; analisar(); });

function render() {
  if (!loaded) return;
  ctx.clearRect(0, 0, 500, 500);
  ctx.save();
  if (document.getElementById('cZom').checked) {
    ctx.translate(250, 250); ctx.scale(2, 2); ctx.translate(-cx, -cy);
  }
  const sc = Math.max(500 / img.width, 500 / img.height);
  const iw = img.width * sc, ih = img.height * sc;
  ctx.drawImage(img, (500 - iw)/2, (500 - ih)/2, iw, ih);

  if (document.getElementById('cRai').checked) {
    ctx.strokeStyle = 'rgba(255,80,80,0.7)'; ctx.lineWidth = 1;
    for (let a = 0; a < 360; a += 30) {
      let r = a * Math.PI / 180;
      ctx.beginPath(); ctx.moveTo(cx + rP*Math.cos(r), cy + rP*Math.sin(r));
      ctx.lineTo(cx + rI*Math.cos(r), cy + rI*Math.sin(r)); ctx.stroke();
    }
  }
  if (document.getElementById('cJen').checked) {
    ctx.strokeStyle = 'rgba(190,210,255,0.75)'; ctx.lineWidth = 1;
    let st = (rI - rP) / 7;
    for (let i = 1; i < 7; i++) {
      ctx.beginPath(); ctx.arc(cx, cy, rP + i*st, 0, 2*Math.PI); ctx.stroke();
    }
  }
  ctx.strokeStyle = '#facc15'; ctx.lineWidth = mode==='pup' ? 3.5 : 2;
  ctx.beginPath(); ctx.arc(cx, cy, rP, 0, 2*Math.PI); ctx.stroke();

  ctx.strokeStyle = '#22c55e'; ctx.lineWidth = mode==='iris' ? 3.5 : 2.5;
  ctx.beginPath(); ctx.arc(cx, cy, rI, 0, 2*Math.PI); ctx.stroke();

  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(cx-5, cy); ctx.lineTo(cx+5, cy); ctx.moveTo(cx, cy-5); ctx.lineTo(cx, cy+5); ctx.stroke();
  ctx.restore();
}

function analisar() {
  if (!loaded) return;
  const off = document.createElement('canvas'); off.width = 500; off.height = 500;
  const oCtx = off.getContext('2d');
  const sc = Math.max(500 / img.width, 500 / img.height);
  oCtx.drawImage(img, (500 - img.width*sc)/2, (500 - img.height*sc)/2, img.width*sc, img.height*sc);
  const d = oCtx.getImageData(0, 0, 500, 500).data;

  const pw = 360, ph = 65;
  const pIm = pCtx.createImageData(pw, ph);
  const gr = new Float32Array(pw * ph);

  for (let y = 0; y < ph; y++) {
    let r = rP + (y / ph) * (rI - rP);
    for (let x = 0; x < pw; x++) {
      let rad = (x * 2 * Math.PI) / pw;
      let sx = Math.min(499, Math.max(0, Math.round(cx + r * Math.cos(rad))));
      let sy = Math.min(499, Math.max(0, Math.round(cy + r * Math.sin(rad))));
      let i = (sy * 500 + sx) * 4;
      let l = 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
      gr[y*pw + x] = l;
      let di = (y*pw + x)*4;
      pIm.data[di] = l; pIm.data[di+1] = l; pIm.data[di+2] = l; pIm.data[di+3] = 255;
    }
  }
  pCtx.putImageData(pIm, 0, 0);

  let s = 0, sq = 0, n = 0;
  for (let y = 1; y < ph - 1; y++) {
    for (let x = 1; x < pw - 1; x++) {
      let k = y*pw + x;
      let lp = -4*gr[k] + gr[k-1] + gr[k+1] + gr[k-pw] + gr[k+pw];
      s += lp; sq += lp*lp; n++;
    }
  }
  let v = (sq / n) - Math.pow(s / n, 2);
  let pr = (rP / rI) * 100;

  document.getElementById('vProp').innerText = pr.toFixed(1) + '%';
  document.getElementById('vTex').innerText = v.toFixed(0);

  let dn = v < 120 ? "Grau 1 (Seda)" : v < 280 ? "Grau 2 (Seda/Linho)" : v < 600 ? "Grau 3 (Linho)" : v < 1000 ? "Grau 4 (Algodão)" : "Grau 5 (Rede - Fragilidade)";
  let sn = pr > 33 ? "Simpaticotonia (Midríase)" : pr < 20 ? "Parassimpaticotonia (Miose)" : "Equilíbrio Autonômico";

  document.getElementById('vDiag').innerHTML = "<b>Constituição:</b> " + dn + "<br><b>SNA:</b> " + sn;

  const nome = document.getElementById('pacNome').value || "Paciente";
  const olho = document.getElementById('pacOlho').value || "OE";
  const queixa = document.getElementById('pacQueixa').value || "-";
  laudoTxt = `LAUDO IRIDOLÓGICO - ${nome} (${olho})\nQueixa: ${queixa}\nRelação Pupila/Íris: ${pr.toFixed(1)}% (${sn})\nÍndice de Fibras: ${v.toFixed(0)} - ${dn}\n`;
}

function dlLaudo() {
  const b = new Blob([laudoTxt], {type:'text/plain;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b);
  a.download = "Laudo_Iridologico.txt";
  a.click();
}
</script>
</body>
</html>
