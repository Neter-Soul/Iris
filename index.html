<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Estação Iridológica — Leitor Direto</title>
<style>
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 12px; background: #f8fafc; color: #0f172a; }
  h2 { margin: 0 0 2px 0; font-size: 19px; color: #0369a1; }
  .sub { font-size: 12px; color: #64748b; margin-bottom: 12px; }
  .box { background: #fff; padding: 12px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 12px; }
  .row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
  input[type="text"], select { flex: 1; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; background: #fff; }
  .btn-up { display: block; background: #0284c7; color: #fff; text-align: center; padding: 14px; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; margin-bottom: 12px; }
  input[type="file"] { display: none; }
  .canvas-box { position: relative; width: 100%; max-width: 480px; margin: 0 auto; border-radius: 12px; overflow: hidden; background: #000; touch-action: none; }
  canvas { width: 100%; display: block; touch-action: none; }
  .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .ctrl-btn { background: #e2e8f0; border: none; padding: 10px; border-radius: 8px; font-weight: bold; font-size: 13px; cursor: pointer; color: #334155; }
  .ctrl-btn.primary { background: #0f766e; color: #fff; grid-column: span 2; }
  .diag { background: #e0f2fe; padding: 10px; border-radius: 8px; font-size: 13px; line-height: 1.4; margin-top: 10px; }
</style>
</head>
<body>

<h2>🔬 Estação Iridológica — Leitor Direto</h2>
<div class="sub">Carregamento Simples • Ajuste de Anéis por Toque</div>

<div class="box">
  <div class="row">
    <input type="text" id="pacNome" placeholder="Nome do Avaliado" value="Lavinia">
    <select id="pacOlho" style="max-width:130px; font-weight:bold;">
      <option value="OE">👁️ Olho Esq (OE)</option>
      <option value="OD">👁️ Olho Dir (OD)</option>
    </select>
  </div>
</div>

<label class="btn-up">
  📁 Toque Aqui para Escolher a Imagem da Íris
  <input type="file" id="fIn" accept="image/*">
</label>

<div id="appArea" style="display:none;">
  <div class="canvas-box">
    <canvas id="cv" width="500" height="500"></canvas>
  </div>
  <div style="text-align:center; font-size:11px; color:#64748b; margin-top:4px;">Arraste com o dedo para mover os anéis sobre a pupila e a íris</div>

  <div class="controls">
    <button class="ctrl-btn primary" onclick="centralizarAneis()">🎯 Centrar Anéis na Imagem</button>
    <button class="ctrl-btn" onclick="mudarRaioPupila(-5)">🟡 Pupila -</button>
    <button class="ctrl-btn" onclick="mudarRaioPupila(5)">🟡 Pupila +</button>
    <button class="ctrl-btn" onclick="mudarRaioIris(-8)">🟢 Íris -</button>
    <button class="ctrl-btn" onclick="mudarRaioIris(8)">🟢 Íris +</button>
  </div>

  <div class="diag" id="vDiag">
    <b>Estado:</b> Imagem carregada com sucesso. Ajuste os anéis e verifique a proporção.
  </div>
</div>

<script>
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let img = new Image(), loaded = false;
let cx = 250, cy = 250, rP = 55, rI = 170;
let isDragging = false, startX = 0, startY = 0, scx = 250, scy = 250;

document.getElementById('fIn').onchange = function(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(evt) {
    img.onload = function() {
      loaded = true;
      document.getElementById('appArea').style.display = 'block';
      centralizarAneis();
    };
    img.src = evt.target.result;
  };
  reader.readAsDataURL(file);
};

function centralizarAneis() {
  if (!loaded) return;
  cx = 250;
  cy = 250;
  rP = Math.round(Math.min(img.width, img.height) * 0.12);
  rI = Math.round(Math.min(img.width, img.height) * 0.35);
  render();
}

function mudarRaioPupila(val) {
  rP = Math.max(10, rP + val);
  render();
}

function mudarRaioIris(val) {
  rI = Math.max(rP + 10, rI + val);
  render();
}

cv.addEventListener('touchstart', function(e) {
  e.preventDefault();
  if (e.touches.length === 1) {
    isDragging = true;
    const b = cv.getBoundingClientRect();
    startX = (e.touches[0].clientX - b.left) * (cv.width / b.width);
    startY = (e.touches[0].clientY - b.top) * (cv.height / b.height);
    scx = cx; scy = cy;
  }
}, {passive:false});

cv.addEventListener('touchmove', function(e) {
  e.preventDefault();
  if (isDragging && e.touches.length === 1) {
    const b = cv.getBoundingClientRect();
    const x = (e.touches[0].clientX - b.left) * (cv.width / b.width);
    const y = (e.touches[0].clientY - b.top) * (cv.height / b.height);
    cx = Math.max(20, Math.min(480, scx + (x - startX)));
    cy = Math.max(20, Math.min(480, scy + (y - startY)));
    render();
  }
}, {passive:false});

cv.addEventListener('touchend', function() { isDragging = false; });

function render() {
  if (!loaded) return;
  ctx.clearRect(0, 0, 500, 500);
  
  const sc = Math.max(500 / img.width, 500 / img.height);
  const iw = img.width * sc, ih = img.height * sc;
  ctx.drawImage(img, (500 - iw)/2, (500 - ih)/2, iw, ih);

  ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
  ctx.lineWidth = 1;
  for (let a = 0; a < 360; a += 30) {
    let rad = a * Math.PI / 180;
    ctx.beginPath();
    ctx.moveTo(cx + rP * Math.cos(rad), cy + rP * Math.sin(rad));
    ctx.lineTo(cx + rI * Math.cos(rad), cy + rI * Math.sin(rad));
    ctx.stroke();
  }

  let st = (rI - rP) / 7;
  for (let i = 1; i < 7; i++) {
    ctx.strokeStyle = (i === 3) ? 'rgba(251, 191, 36, 0.9)' : 'rgba(190, 210, 255, 0.6)';
    ctx.lineWidth = (i === 3) ? 1.5 : 1;
    ctx.beginPath(); ctx.arc(cx, cy, rP + i * st, 0, 2 * Math.PI); ctx.stroke();
  }

  ctx.strokeStyle = '#facc15'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(cx, cy, rP, 0, 2 * Math.PI); ctx.stroke();

  ctx.strokeStyle = '#22c55e'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(cx, cy, rI, 0, 2 * Math.PI); ctx.stroke();

  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(cx-6, cy); ctx.lineTo(cx+6, cy);
  ctx.moveTo(cx, cy-6); ctx.lineTo(cx, cy+6); ctx.stroke();

  let prop = ((rP / rI) * 100).toFixed(1);
  document.getElementById('vDiag').innerHTML = `<b>Proporção Pupila/Íris:</b> ${prop}%<br><b>Centro:</b> X=${Math.round(cx)}, Y=${Math.round(cy)}`;
}
</script>
</body>
</html>
